name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm64, 386]
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: mips
            gomips: softfloat
          - goos: linux
            goarch: mipsle
            gomips: softfloat
          - goos: freebsd
            goarch: arm
        exclude:
          - goos: darwin
            goarch: 386

    name: Build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOMIPS: ${{ matrix.gomips }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid tag: $tag"
            echo "Expected SemVer vMAJOR.MINOR.PATCH with MAJOR >= 1 (starting v1.0.0)"
            exit 1
          fi
          if (( BASH_REMATCH[1] < 1 )); then
            echo "Refusing tag $tag: this product line starts at v1.0.0"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean

      - name: Archive
        run: zip -jr dist/santaizi-agent_${GOOS}_${GOARCH}.zip dist/*/*

      # Private repos on GitHub Free share a ~500MB Actions artifact quota
      # across the whole account. Stage binaries on a per-run draft release
      # instead so publish jobs are not blocked by that quota.
      - name: Upload binaries to temporary release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "$CI_TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$CI_TAG" \
              --draft \
              --target "${{ github.sha }}" \
              --title "CI artifacts ${{ github.run_id }}" \
              --notes "Temporary build outputs for ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Deleted after publish." \
              && break || true
            sleep 2
          done
          gh release view "$CI_TAG" >/dev/null
          shopt -s nullglob
          files=(dist/santaizi-agent_${GOOS}_${GOARCH}*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build outputs to upload" >&2
            exit 1
          fi
          gh release upload "$CI_TAG" "${files[@]}" --clobber

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Release
    permissions:
      contents: write
    steps:
      # gh infers the repo from git remotes. This job has no checkout, so
      # GH_REPO is required; otherwise download fails with "not a git repository".
      - name: Download binaries from temporary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          mkdir -p bin
          gh release download "$CI_TAG" --dir bin
          ls -la bin/

      - name: Checksum
        run: sha256sum ./bin/*.zip | awk -F" |/" '{print $1, $NF}' > checksums.txt

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "checksums.txt,bin/*.zip"
          generateReleaseNotes: true

  cleanup:
    name: Cleanup CI release
    permissions:
      contents: write
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary CI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$CI_TAG" >/dev/null 2>&1; then
            gh release delete "$CI_TAG" --yes
          else
            echo "no temporary release $CI_TAG to delete"
          fi
          # Drafts may be untagged; ignore a missing git ref.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${CI_TAG}" >/dev/null 2>&1 || true
